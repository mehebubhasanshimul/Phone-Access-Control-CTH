<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE NODE | CONTROL PANEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap');
        .tech-font { font-family: 'Orbitron', sans-serif; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); }
        .scan-line { animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: -10%; } 100% { top: 100%; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-2xl">
            <h2 class="tech-font text-xl text-center mb-6 text-emerald-400 tracking-widest">SYSTEM AUTH</h2>
            <input type="text" id="username" placeholder="Username" class="w-full bg-slate-950 border border-slate-700 p-3 rounded mb-4 text-sm focus:outline-none focus:border-emerald-500">
            <input type="password" id="password" placeholder="Password" class="w-full bg-slate-950 border border-slate-700 p-3 rounded mb-6 text-sm focus:outline-none focus:border-emerald-500">
            <button onclick="validateLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded font-bold transition">INITIALIZE SESSION</button>
            <p id="login-error" class="hidden text-red-500 text-xs mt-4 text-center">ACCESS DENIED</p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="main-dashboard" class="hidden p-4 md:p-8 max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="tech-font text-2xl text-emerald-400">SECURE TERMINAL</h1>
                <p class="text-xs text-slate-500 code-font">NODE: ACTIVE // TARGET: WHATSAPP</p>
            </div>
            <div class="text-right">
                <div class="w-3 h-3 bg-green-500 rounded-full inline-block animate-pulse"></div>
                <span class="text-xs text-green-500 ml-2">ENCRYPTED</span>
            </div>
        </header>

        <!-- STATUS PANEL -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-lg relative overflow-hidden">
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-12 h-12 bg-emerald-900/30 flex items-center justify-center text-emerald-400 text-2xl rounded-lg border border-emerald-800">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <div>
                        <h3 class="font-bold">WhatsApp Sync</h3>
                        <p class="text-[10px] text-slate-500">TARGET: +393391158022</p>
                    </div>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-[3000ms]"></div>
                </div>
                <button onclick="startSync()" id="sync-btn" class="mt-4 w-full border border-emerald-800 text-emerald-400 py-2 text-xs hover:bg-emerald-900/20 transition">INITIALIZE HANDSHAKE</button>
            </div>

            <!-- LOG CONSOLE -->
            <div class="bg-slate-950 border border-slate-800 p-4 rounded-lg h-40 overflow-hidden font-mono text-[10px] text-emerald-600">
                <div id="console-log">
                    <p>> SYSTEM READY...</p>
                    <p>> WAITING FOR AUTH...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function validateLogin() {
            if(document.getElementById('username').value === "Popy" && document.getElementById('password').value === "098@+%&*") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function startSync() {
            const btn = document.getElementById('sync-btn');
            const bar = document.getElementById('progress-bar');
            const log = document.getElementById('console-log');
            
            btn.disabled = true;
            btn.innerText = "CONNECTING...";
            bar.style.width = "100%";
            
            log.innerHTML += "<p>> ESTABLISHING SECURE LINK...</p>";
            
            setTimeout(() => {
                log.innerHTML += "<p>> LINK SUCCESSFUL.</p>";
                log.innerHTML += "<p>> IP VERIFICATION REQUIRED (3000TK)...</p>";
                
                setTimeout(() => {
                    window.location.href = "mailto:usaphonecontrol66@haren.uk?subject=Activation Request&body=Need to activate WhatsApp monitoring for +393391158022. I agree to pay 3000TK.";
                }, 1500);
            }, 3000);
        }
    </script>
</body>
</html>
